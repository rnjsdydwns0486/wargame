<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>War Game · 참가자 화면 (1~7조 · A~H)</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background: #FAF8F5; color: #1F2937; }
    .card { background: #FFF; border: 1px solid #EAE5DC; border-radius: 1.25rem; box-shadow: 0 4px 18px rgba(0,0,0,0.04); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-20 bg-[#FAF8F5]/90 backdrop-blur border-b border-stone-200">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between gap-2">
      <div class="font-extrabold text-stone-900 flex items-center gap-2 text-sm sm:text-base">
        <span>⚔️</span>
        <span id="navTitle">War Game · 전쟁 게임</span>
      </div>
      <div class="flex items-center gap-2">
        <span id="myBadge" class="hidden px-2.5 py-1 rounded-full text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200"></span>
        <button id="btnLang" type="button" class="px-2.5 py-1 rounded-lg bg-white border border-stone-200 text-xs font-bold">🇺🇸 EN</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6">
    <!-- 1. Language Select -->
    <section id="secLang" class="max-w-md mx-auto card p-6 space-y-4">
      <div class="text-center">
        <div class="text-3xl mb-2">⚔️</div>
        <h1 class="text-xl font-extrabold">War Game Simulation</h1>
        <p class="text-xs text-stone-500 mt-1">7개 조 · 각 조 A~H 8명 · 3라운드 / 7 Groups · A–H Each</p>
      </div>
      <button id="pickKo" type="button" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold">🇰🇷 한국어로 참가하기</button>
      <button id="pickEn" type="button" class="w-full py-3 rounded-xl bg-white hover:bg-stone-50 border-2 border-stone-200 font-bold">🇺🇸 Join in English</button>
    </section>

    <!-- 2. Entry Form (Name, Student ID, Group 1-7, Gov A-H) -->
    <section id="secEntry" class="hidden max-w-md mx-auto card p-6 space-y-4">
      <h2 id="entryHeading" class="text-lg font-extrabold text-center">전쟁 게임 입장</h2>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label id="lblName" class="block text-xs font-bold text-stone-600 mb-1">이름</label>
          <input id="inName" type="text" maxlength="20" placeholder="홍길동" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm" />
        </div>
        <div>
          <label id="lblSid" class="block text-xs font-bold text-stone-600 mb-1">학번</label>
          <input id="inSid" type="text" maxlength="20" placeholder="20241234" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm" />
        </div>
      </div>

      <div>
        <label id="lblGroup" class="block text-xs font-bold text-stone-600 mb-1.5">소속 조 선택 (1조~7조)</label>
        <div id="groupButtons" class="grid grid-cols-4 gap-2"></div>
      </div>

      <div>
        <label id="lblGov" class="block text-xs font-bold text-stone-600 mb-1.5">조 내 정부 선택 (A~H / 자동 배정 추천)</label>
        <select id="inGov" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm bg-white font-semibold"></select>
      </div>

      <p id="errEntry" class="hidden text-xs font-bold text-red-600"></p>
      <button id="btnJoin" type="button" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold">입장하기 →</button>
    </section>

    <!-- 3. Live Game Stage -->
    <section id="secLive" class="hidden space-y-5">
      <!-- Waiting Lobby -->
      <div id="boxLobby" class="card p-6 text-center space-y-3">
        <div class="text-3xl">⏳</div>
        <h2 id="lobbyTitle" class="text-lg font-extrabold">진행자가 라운드를 시작할 때까지 대기 중...</h2>
        <p id="lobbySub" class="text-xs text-stone-500">같은 조에 들어온 A~H 8명이 서로 전쟁 게임을 진행합니다.</p>
        <div id="lobbySeats" class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2 text-left"></div>
      </div>

      <!-- Active Round Allocation -->
      <div id="boxRound" class="hidden space-y-4">
        <div class="card p-5 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 id="liveRoundTitle" class="text-lg font-extrabold">라운드 1</h2>
              <p id="liveRoundSub" class="text-xs text-stone-500">Wᵢ + Kᵢ = 100 · Cᵢ = 10Kᵢ</p>
            </div>
            <span id="liveTimer" class="px-3 py-1.5 rounded-xl bg-stone-100 font-mono font-extrabold text-sm">01:30</span>
          </div>

          <div class="p-4 rounded-xl bg-stone-50 border border-stone-200 space-y-3">
            <div class="flex justify-between items-center">
              <span id="lblWeaponInput" class="text-sm font-bold">무기 생산량 (Wᵢ)</span>
              <input id="inW" type="number" min="0" max="100" value="20" class="w-20 text-center py-1 rounded-lg border border-stone-300 font-extrabold text-blue-700" />
            </div>
            <input id="slW" type="range" min="0" max="100" value="20" class="w-full" />
            <div class="flex justify-between text-xs font-bold">
              <span class="text-rose-600">Wᵢ = <span id="outW">20</span></span>
              <span class="text-emerald-700">Kᵢ = <span id="outK">80</span> → Cᵢ = <span id="outC">800</span></span>
            </div>
          </div>

          <button id="btnSubmitW" type="button" class="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold">비밀 배분 제출하기</button>
          <p id="submitStatus" class="hidden text-center text-xs font-bold text-emerald-700"></p>
        </div>

        <!-- Round 3 Per-Group Chat -->
        <div id="boxChat" class="hidden card p-5 space-y-3 border-2 border-blue-200">
          <div class="flex items-center justify-between">
            <h3 id="chatHeading" class="font-extrabold text-sm">💬 3라운드 우리 조 자유 토의 (비구속적)</h3>
            <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">Non-Binding</span>
          </div>
          <div id="chatBox" class="h-52 overflow-y-auto bg-stone-50 rounded-xl p-3 space-y-2 border border-stone-200 text-xs"></div>
          <div class="flex gap-2">
            <input id="inChat" type="text" maxlength="160" placeholder="같은 조 A~H에게 메시지 보내기..." class="flex-1 px-3 py-2 rounded-xl border border-stone-300 text-xs" />
            <button id="btnChatSend" type="button" class="px-4 py-2 rounded-xl bg-stone-900 text-white text-xs font-bold">전송</button>
          </div>
        </div>
      </div>

      <!-- Round Result / Final Result -->
      <div id="boxResult" class="hidden card p-6 space-y-4">
        <div class="text-center space-y-1">
          <h2 id="resTitle" class="text-xl font-extrabold">결과 공지</h2>
          <p id="resSub" class="text-sm font-semibold text-stone-600"></p>
        </div>
        <div id="resBody" class="space-y-2 text-xs"></div>
      </div>
    </section>
  </main>

  <script>
    const socket = io();
    const GOV_CODES = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    const govCode = (id) => GOV_CODES[id - 1] || String(id);
    let lang = 'ko';
    let selectedGroupId = 1;
    let myInfo = { groupId: null, govId: null, name: '', studentId: '' };
    let lastGroupState = null;
    let timerIv = null;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    function renderGroupButtons() {
      const ko = lang === 'ko';
      $('groupButtons').innerHTML = Array.from({ length: 7 }, (_, i) => {
        const id = i + 1;
        const active = selectedGroupId === id;
        return `<button type="button" data-gid="${id}" class="g-btn py-2.5 rounded-xl border-2 text-xs font-extrabold transition ${active ? 'border-blue-600 bg-blue-50 text-blue-700' : 'border-stone-200 bg-white text-stone-700 hover:bg-stone-50'}">${ko ? `${id}조` : `Group ${id}`}</button>`;
      }).join('');
      $('groupButtons').querySelectorAll('.g-btn').forEach((b) => {
        b.addEventListener('click', () => { selectedGroupId = Number(b.dataset.gid); renderGroupButtons(); });
      });
    }

    function populateGovSelect() {
      const ko = lang === 'ko';
      $('inGov').innerHTML = `<option value="">${ko ? '빈 자리(A~H) 자동 배정 (추천)' : 'Auto-assign A–H (Recommended)'}</option>` +
        GOV_CODES.map((c, i) => `<option value="${i + 1}">${ko ? `정부 ${c}` : `Government ${c}`}</option>`).join('');
    }

    function applyLang() {
      const ko = lang === 'ko';
      $('btnLang').textContent = ko ? '🇺🇸 EN' : '🇰🇷 KR';
      $('navTitle').textContent = ko ? 'War Game · 전쟁 게임' : 'War Game Simulation';
      $('entryHeading').textContent = ko ? '전쟁 게임 입장' : 'Join War Game';
      $('lblName').textContent = ko ? '이름' : 'Name';
      $('lblSid').textContent = ko ? '학번' : 'Student ID';
      $('lblGroup').textContent = ko ? '소속 조 선택 (1조~7조)' : 'Select Group (Group 1–7)';
      $('lblGov').textContent = ko ? '조 내 정부 선택 (A~H / 자동 배정 추천)' : 'Select Government (A–H / Auto recommended)';
      $('btnJoin').textContent = ko ? '입장하기 →' : 'Join Group →';
      $('lobbyTitle').textContent = ko ? '진행자가 라운드를 시작할 때까지 대기 중...' : 'Waiting for host to start the round...';
      $('lobbySub').textContent = ko ? '같은 조에 들어온 A~H 8명이 서로 전쟁 게임을 진행합니다.' : 'Governments A–H inside your group compete in an independent War Game.';
      $('lblWeaponInput').textContent = ko ? '무기 생산량 (Wᵢ)' : 'Weapons Input (Wᵢ)';
      $('btnSubmitW').textContent = ko ? '비밀 배분 제출하기' : 'Submit Secret Allocation';
      $('chatHeading').textContent = ko ? '💬 3라운드 우리 조 자유 토의 (비구속적)' : '💬 Round 3 Group Discussion (Non-Binding)';
      $('inChat').placeholder = ko ? '같은 조 A~H에게 메시지 보내기...' : 'Message A–H in your group...';
      $('btnChatSend').textContent = ko ? '전송' : 'Send';
      renderGroupButtons();
      populateGovSelect();
      if (myInfo.groupId) {
        $('myBadge').textContent = ko ? `${myInfo.groupId}조 · ${govCode(myInfo.govId)} (${myInfo.name})` : `G${myInfo.groupId} · Gov ${govCode(myInfo.govId)} (${myInfo.name})`;
      }
      if (lastGroupState) renderGroupState(lastGroupState);
    }

    function syncW(val) {
      const w = Math.max(0, Math.min(100, Math.round(Number(val) || 0)));
      $('slW').value = w; $('inW').value = w;
      $('outW').textContent = w; $('outK').textContent = 100 - w; $('outC').textContent = ((100 - w) * 10).toLocaleString();
    }

    function updateTimer(endAt) {
      clearInterval(timerIv);
      if (!endAt) { $('liveTimer').textContent = '--:--'; return; }
      const tick = () => {
        const left = Math.max(0, Math.floor((endAt - Date.now()) / 1000));
        $('liveTimer').textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
      };
      tick();
      timerIv = setInterval(tick, 1000);
    }

    function renderGroupState(g) {
      lastGroupState = g;
      const ko = lang === 'ko';
      $('boxLobby').classList.toggle('hidden', g.phase !== 'lobby');
      const isRound = ['round1', 'round2', 'round3'].includes(g.phase);
      const isResult = ['result1', 'result2', 'result3', 'final'].includes(g.phase);
      $('boxRound').classList.toggle('hidden', !isRound);
      $('boxResult').classList.toggle('hidden', !isResult);

      if (g.phase === 'lobby') {
        $('lobbySeats').innerHTML = g.seats.map((s) => `
          <div class="p-2.5 rounded-xl border ${s.govId === myInfo.govId ? 'border-blue-500 bg-blue-50' : (s.occupied ? 'border-stone-300 bg-white' : 'border-stone-200 bg-stone-50 text-stone-400')}">
            <div class="font-extrabold text-xs">${ko ? `정부 ${govCode(s.govId)}` : `Gov ${govCode(s.govId)}`}</div>
            <div class="text-[11px] truncate mt-0.5">${s.occupied ? esc(s.name) : (ko ? '빈 자리' : 'Empty')}</div>
          </div>
        `).join('');
      }

      if (isRound) {
        const r = g.currentRound;
        $('liveRoundTitle').textContent = ko ? `${g.groupId}조 (${govCode(myInfo.govId)}) · 라운드 ${r}${r === 3 ? ' (자유 토의)' : ' (토의 불가)'}` : `Group ${g.groupId} (Gov ${govCode(myInfo.govId)}) · Round ${r}`;
        updateTimer(g.timerEndAt);
        const mySeat = g.seats[myInfo.govId - 1];
        if (mySeat && mySeat.submitted) {
          $('submitStatus').classList.remove('hidden');
          $('submitStatus').textContent = ko ? '✅ 제출 완료! (마감 전 수정 가능)' : '✅ Submitted! (Can update before lock)';
        } else {
          $('submitStatus').classList.add('hidden');
        }
        $('boxChat').classList.toggle('hidden', r !== 3);
        if (r === 3) {
          $('chatBox').innerHTML = g.chat.map((m) => `
            <div class="${m.govId === myInfo.govId ? 'text-right' : 'text-left'}">
              <span class="text-[10px] font-bold text-stone-500">${ko ? `정부 ${govCode(m.govId)}` : `Gov ${govCode(m.govId)}`} · ${esc(m.name)}</span>
              <div class="inline-block px-3 py-1.5 rounded-xl mt-0.5 ${m.govId === myInfo.govId ? 'bg-blue-600 text-white' : 'bg-white border border-stone-200'}">${esc(m.text)}</div>
            </div>
          `).join('');
          $('chatBox').scrollTop = $('chatBox').scrollHeight;
        }
      }

      if (isResult) {
        if (g.phase === 'final') {
          $('resTitle').textContent = ko ? `🏁 ${g.groupId}조 최종 3라운드 순위 (A~H)` : `🏁 Group ${g.groupId} Final Standings (A–H)`;
          const totals = Array.from({ length: 8 }, (_, i) => {
            const played = g.roundsHistory.some((r) => !r.details[i]?.absent);
            const sum = g.roundsHistory.reduce((acc, r) => acc + (r.details[i]?.finalC || 0), 0);
            const seat = g.seats[i];
            return { govId: i + 1, name: seat?.name, played, sum };
          }).filter((x) => x.played).sort((a, b) => b.sum - a.sum);
          $('resSub').textContent = totals.length
            ? (ko ? `우승: 정부 ${govCode(totals[0].govId)} (${totals[0].sum.toFixed(1)} Cᵢ)` : `Winner: Gov ${govCode(totals[0].govId)} (${totals[0].sum.toFixed(1)} Cᵢ)`)
            : '';
          $('resBody').innerHTML = totals.map((t, idx) => `
            <div class="flex justify-between p-2.5 rounded-xl border ${t.govId === myInfo.govId ? 'border-blue-500 bg-blue-50 font-extrabold' : 'border-stone-200'}">
              <span>#${idx + 1} ${ko ? `정부 ${govCode(t.govId)}` : `Gov ${govCode(t.govId)}`} ${t.name ? `(${esc(t.name)})` : ''}</span>
              <span class="font-mono text-blue-700">${t.sum.toFixed(1)} Cᵢ</span>
            </div>
          `).join('');
        } else {
          const latest = g.roundsHistory[g.roundsHistory.length - 1];
          if (!latest) return;
          const myRes = latest.details[myInfo.govId - 1];
          $('resTitle').textContent = ko ? `${g.groupId}조 라운드 ${latest.round}: ${latest.stage.ko}` : `Group ${g.groupId} Round ${latest.round}: ${latest.stage.en}`;
          $('resSub').textContent = `W_total = ${latest.wTotal} (${latest.activeCount}${ko ? '명 참여' : ' active'}) · α=${Math.round(latest.stage.alpha*100)}% / β=${Math.round(latest.stage.beta*100)}% / γ=${Math.round(latest.stage.gamma*100)}%`;
          $('resBody').innerHTML = myRes.absent
            ? `<div class="p-4 rounded-xl bg-stone-100 border border-stone-200 text-center text-stone-500 font-bold">${ko ? '이번 라운드 미제출(빈 자리)로 처리되었습니다.' : 'No submission recorded this round (Absent).'}</div>`
            : `<div class="p-4 rounded-xl bg-blue-50 border border-blue-200 text-center">
                 <div class="text-xs font-bold text-blue-800">${ko ? `정부 ${govCode(myInfo.govId)} 최종 소비재 점수 (Final Cᵢ)` : `Gov ${govCode(myInfo.govId)} Final Goods (Cᵢ)`}</div>
                 <div class="text-3xl font-extrabold font-mono text-blue-700 mt-1">${myRes.finalC.toFixed(1)}</div>
                 <div class="text-xs text-stone-600 mt-1">W=${myRes.w}, K=${myRes.k} · ${ko ? '보존' : 'Retained'} ${myRes.retained} + ${ko ? '재분배' : 'Redistributed'} ${myRes.redistributed}</div>
               </div>`;
        }
      }
    }

    $('pickKo').addEventListener('click', () => { lang = 'ko'; applyLang(); $('secLang').classList.add('hidden'); $('secEntry').classList.remove('hidden'); });
    $('pickEn').addEventListener('click', () => { lang = 'en'; applyLang(); $('secLang').classList.add('hidden'); $('secEntry').classList.remove('hidden'); });
    $('btnLang').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; applyLang(); });
    $('slW').addEventListener('input', (e) => syncW(e.target.value));
    $('inW').addEventListener('input', (e) => syncW(e.target.value));

    $('btnJoin').addEventListener('click', () => {
      const name = $('inName').value.trim();
      const studentId = $('inSid').value.trim();
      const govId = $('inGov').value;
      if (!name || !studentId) {
        $('errEntry').textContent = lang === 'ko' ? '이름과 학번을 모두 입력해 주세요.' : 'Please enter both Name and Student ID.';
        $('errEntry').classList.remove('hidden');
        return;
      }
      $('errEntry').classList.add('hidden');
      myInfo.name = name; myInfo.studentId = studentId;
      socket.emit('player:join', { name, studentId, groupId: selectedGroupId, govId, lang });
    });

    $('btnSubmitW').addEventListener('click', () => socket.emit('player:submit', { w: Number($('inW').value) }));
    $('btnChatSend').addEventListener('click', () => {
      const text = $('inChat').value.trim();
      if (!text) return;
      $('inChat').value = '';
      socket.emit('player:chat', { text });
    });
    $('inChat').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnChatSend').click(); });

    socket.on('player:error', ({ message }) => { $('errEntry').textContent = message; $('errEntry').classList.remove('hidden'); });
    socket.on('player:joined', ({ groupId, govId }) => {
      myInfo.groupId = groupId; myInfo.govId = govId;
      $('secEntry').classList.add('hidden');
      $('secLive').classList.remove('hidden');
      $('myBadge').classList.remove('hidden');
      $('myBadge').textContent = lang === 'ko' ? `${groupId}조 · ${govCode(govId)} (${myInfo.name})` : `G${groupId} · Gov ${govCode(govId)} (${myInfo.name})`;
    });
    socket.on('group:state', renderGroupState);

    renderGroupButtons();
    populateGovSelect();
    syncW(20);
  </script>
</body>
</html>
